spec: 0
id: moderation
version: 0.5.0
license: CC0-1.0
tested: jev-1.13.0
description: >-
  First-pass moderation of user-generated text under a standard platform policy:
  action, severity, and whether a protected group is targeted. Non-goals: legal
  review, appeals handling, age verification.
state:
  description: One piece of user-generated text.
  fields: [text]
questions:
  action:
    type: choice
    instructions: "What should happen with this text under the policy described in this pack's README? Apply the first matching action: remove for credible threats, calls for violence, doxxing, sextortion, scams, phishing, fraud, and hate or demeaning generalizations targeting a protected group; review for insults or harassment of individuals, spam, veiled threats and borderline coded language; allow for criticism, disagreement and profanity not aimed at a person; unknown for unreadable input."
    options:
      allow: "No policy concern."
      review: "Borderline or suspicious; needs a human moderator."
      remove: "Clear policy violation; remove it."
      unknown: "Cannot classify confidently."
  severity:
    type: score
    instructions: "How severe is the harm this text could cause if left visible? Apply the first matching level: high for threats, doxxing, hate with protected targeting, or fraud; medium for a targeted insult or harassment of a person, or a demeaning generalization; low for rudeness, profanity or spam without a target; none for no harm."
    levels: [none, low, medium, high, unknown]
    level_descriptions:
      none: "No harm: criticism, disagreement or a neutral comment."
      low: "Mild: rudeness, profanity not aimed at a person, or spam."
      medium: "A targeted insult or harassment of a person; a demeaning generalization."
      high: "Threats, doxxing, hate with protected targeting, or fraud."
      unknown: "Cannot judge severity."
  targeted_group:
    type: noul
    instructions: "Does the text attack or demean people based on a protected characteristic (race, ethnicity, religion, sex, sexual orientation, disability, national origin)?"
thresholds:
  action: {allow: 0.8, review: 0.6, remove: 0.8}
  severity: {none: 0.7, low: 0.7, medium: 0.7, high: 0.7}
  targeted_group: {true: 0.9, false: 0.9}
