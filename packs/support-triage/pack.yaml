spec: 0
id: support-triage
version: 0.5.0
license: CC0-1.0
tested: jev-1.13.0
description: >-
  First-line triage of an inbound customer support message: refund intent,
  owning queue and urgency. Non-goals: drafting replies, sentiment analysis,
  language detection, spam filtering.
state:
  description: One inbound customer support message as received.
  fields: [message]
questions:
  refund_request:
    type: noul
    instructions: "Does the message explicitly ask for a refund, return, or money back?"
  queue:
    type: choice
    instructions: "Which team should handle this message?"
    options:
      billing: "Payments, invoices, charges or refunds."
      technical: "Product errors, outages, integrations or configuration."
      shipping: "Delivery, tracking, address or packaging."
      account: "Login, password, plan, permissions or deletion."
      other: "Does not fit any queue above."
      unknown: "Cannot tell from the message."
  urgency:
    type: score
    instructions: "How soon does this message need a human response? Apply the first matching level: critical for an ongoing outage, active data loss, or a live security incident; high when work is blocked, access is lost, or money is at stake (an explicit refund or money-back request counts as money at stake); normal for a standard request with no stated impact; low for feedback, questions, pre-sales or cosmetics."
    levels: [low, normal, high, critical, unknown]
    level_descriptions:
      critical: "Ongoing outage, active data loss, or a live security incident (unauthorized access, leaked credentials, a data breach)."
      high: "Work blocked, access lost, or money at stake, including any explicit refund or money-back request. Nothing is actively broken."
      normal: "A standard request with no stated impact."
      low: "Feedback, a question, pre-sales or cosmetic: nothing depends on the outcome."
      unknown: "Cannot tell from the message. Tone alone never sets urgency."
thresholds:
  refund_request: {true: 0.8, false: 0.8}
  queue: {billing: 0.6, technical: 0.6, shipping: 0.6, account: 0.6, other: 0.6}
  urgency: {low: 0.7, normal: 0.7, high: 0.7, critical: 0.7}
