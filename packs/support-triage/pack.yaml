spec: 0
id: support-triage
version: 0.7.0
license: CC0-1.0
tested: jev-1.13.0
description: >-
  First-line triage of an inbound customer support message: refund intent,
  owning queue and urgency. Non-goals: drafting replies, sentiment analysis,
  language detection, spam filtering.
state:
  description: One inbound customer support message as received.
  fields: [message]
questions:
  refund_request:
    type: noul
    instructions: "Does the message explicitly ask for a refund, a return, a charge reversal (for example 'please reverse the double charge') or money back?"
  queue:
    type: choice
    instructions: "Which team should handle this message?"
    options:
      billing: "Payments, invoices, charges, tax forms or refunds."
      technical: "Product errors, outages, integrations or how-to for using a feature."
      shipping: "Delivery, tracking, address or packaging of physical goods."
      account: "Login, password, plan, team members, workspace settings, data export or deletion."
      other: "Pre-sales questions, evaluations, compliance checks (audit logs, data regions) or anything that fits no queue above."
      unknown: "Cannot tell from the message."
  urgency:
    type: score
    instructions: "How soon does this message need a human response? critical when a capability the sender depends on is completely unavailable right now with no routine fix, data is being lost right now, or a live security incident is ongoing (unauthorized access, leaked credentials, a data breach); high when the message reports something that is not working, failing, delayed, missing, or costing money (bugs, defects, delivery problems, stuck requests and explicit refund requests all count), including access problems a routine support action can restore (password resets, restore from backup, re-invites); normal for requests, questions, feedback, feature requests and everything else with no malfunction; unknown when the message is unreadable. Calm phrasing never lowers urgency and dramatic phrasing never raises it."
    levels: [normal, high, critical, unknown]
    level_descriptions:
      critical: "A needed capability is completely unavailable right now with no routine fix, data is being lost right now, or a live security incident is ongoing."
      high: "Something is not working, failing, delayed, missing or costing money; includes access problems a routine support action can restore."
      normal: "A request, question, feedback or feature request with no malfunction."
      unknown: "Cannot tell from the message."
thresholds:
  refund_request: {true: 0.8, false: 0.8}
  queue: {billing: 0.6, technical: 0.6, shipping: 0.6, account: 0.6, other: 0.6}
  urgency: {normal: 0.7, high: 0.7, critical: 0.7}
