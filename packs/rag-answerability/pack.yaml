spec: 0
id: rag-answerability
version: 0.5.0
license: CC0-1.0
tested: jev-1.13.0
description: >-
  Decide whether a question is answerable from the retrieved context alone and,
  when it is not, what kind of information is missing. Non-goals: answering the
  question, judging passage relevance, rewriting queries.
state:
  description: One question and the full context retrieved for it.
  fields: [question, context]
questions:
  answerable:
    type: noul
    instructions: "Can `question` be answered completely using only `context`? A concise but sufficient answer — the facts, numbers or the action to take — counts as complete; it need not spell out every detail."
  missing_info:
    type: choice
    instructions: "When `answerable` is false, what kind of information is missing from `context`? Use `none` whenever the question is answerable. Otherwise apply the first matching kind: entity, date, number, procedure, other, or unknown when the context only defers ('depends', 'varies') and nothing specific can be named."
    options:
      none: "Context is sufficient; answerable is true."
      entity: "A named person, organization, product or place."
      date: "A date, duration or time period."
      number: "A quantity, price, rate or count."
      procedure: "The action or steps are not stated; the context only says something exists, is supported or is available."
      other: "A specific missing element that fits none of the categories above."
      unknown: "The context only defers ('depends', 'varies'); what is missing cannot be named."
thresholds:
  answerable: {true: 0.85, false: 0.85}
  missing_info: {none: 0.8, entity: 0.7, date: 0.7, number: 0.7, procedure: 0.7, other: 0.7}
