name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Validate packs (spec v0)
        run: uv run --no-project --with pyyaml python scripts/validate.py
      - name: Scoreboard is current
        run: python3 scripts/build_scoreboard.py --check
