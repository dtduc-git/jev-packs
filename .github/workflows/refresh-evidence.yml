name: Refresh evidence

on:
  workflow_dispatch:
    inputs:
      model:
        description: TypeSafe model to record against
        required: false
        default: jev-latest
      packs:
        description: Comma-separated pack ids, or "all"
        required: false
        default: all

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install jevassert
        run: uv tool install jevassert==0.1.0
      - name: Re-record, refresh evidence, update registry
        env:
          PACKS: ${{ inputs.packs }}
          MODEL: ${{ inputs.model }}
        run: |
          uv run --no-project --with pyyaml python scripts/refresh.py \
            --packs "$PACKS" \
            --model "$MODEL"
      - name: Open a pull request
        if: always()
        env:
          PACKS: ${{ inputs.packs }}
          MODEL: ${{ inputs.model }}
        run: |
          if git diff --quiet; then
            echo "no changes — evidence already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="refresh-evidence-${{ github.run_id }}"
          git checkout -b "$branch"
          git add -A
          git commit -m "Refresh evidence against $MODEL"
          git push -u origin "$branch"
          gh pr create \
            --title "Refresh evidence against $MODEL" \
            --body "Automated by the Refresh evidence workflow (packs: $PACKS). Review the evidence diffs, then merge." \
            --base master \
            --head "$branch"
